<meta charset="UTF-8">
<title>Fingramm</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F5F7F5; --surface:#FFFFFF; --surface-2:#EEF2EE;
    --text:#16211C; --text-2:#55635B; --border:#DCE3DE;
    --emerald:#1F7A5C; --emerald-soft:#E4F0EA;
    --indigo:#35507A; --indigo-soft:#E7ECF3;
    --amber:#96691D; --amber-soft:#F5ECD8;
    --brick:#A83E28; --brick-soft:#F6E5E0;
    --grid-dot: rgba(22,33,28,0.06);
    --shadow: 0 1px 2px rgba(20,30,25,0.06), 0 8px 24px rgba(20,30,25,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12160F; --surface:#1A2018; --surface-2:#212820;
      --text:#EBEFE9; --text-2:#A7B3A9; --border:#2C352A;
      --emerald:#49CE9C; --emerald-soft:#1B2E26;
      --indigo:#8FADDE; --indigo-soft:#1E2733;
      --amber:#E3B24F; --amber-soft:#2F2A18;
      --brick:#E27757; --brick-soft:#33221C;
      --grid-dot: rgba(235,239,233,0.05);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 28px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12160F; --surface:#1A2018; --surface-2:#212820;
    --text:#EBEFE9; --text-2:#A7B3A9; --border:#2C352A;
    --emerald:#49CE9C; --emerald-soft:#1B2E26;
    --indigo:#8FADDE; --indigo-soft:#1E2733;
    --amber:#E3B24F; --amber-soft:#2F2A18;
    --brick:#E27757; --brick-soft:#33221C;
    --grid-dot: rgba(235,239,233,0.05);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 28px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--grid-dot) 1px, transparent 1px);background-size:22px 22px;color:var(--text);font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',sans-serif;line-height:1.6;min-height:100vh;}
  h1,h2,h3{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:0.01em;text-wrap:balance;line-height:1.05;margin:0;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  button{font-family:inherit;cursor:pointer;}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--emerald);outline-offset:2px;}

  #app{max-width:720px;margin:0 auto;padding:24px 20px 80px;min-height:100vh;}

  .theme-toggle{background:var(--surface);border:1px solid var(--border);border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:0.9rem;line-height:1;flex:none;}
  .theme-toggle:hover{border-color:var(--emerald);}
  .hero{position:relative;}
  .hero .theme-toggle{position:absolute;top:16px;right:10px;}

  .topbar{padding:10px 4px 18px;border-bottom:1px solid var(--border);margin-bottom:28px;}
  .topbar-row{display:flex;justify-content:space-between;align-items:center;}
  .logo{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:1.3rem;letter-spacing:0.02em;}
  .cyc-badge{font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;}

  .progress{display:flex;gap:6px;margin-top:14px;}
  .progress .seg{flex:1;height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;position:relative;}
  .progress .seg.done{background:var(--emerald);border-color:var(--emerald);}
  .progress .seg.active{background:var(--emerald);border-color:var(--emerald);opacity:0.5;}
  .progress .seg.active::after{content:"";position:absolute;inset:0;background:var(--emerald);animation:seg-pulse 1.6s ease-in-out infinite;}
  @keyframes seg-pulse{0%,100%{opacity:0.35;}50%{opacity:0.9;}}
  @media (prefers-reduced-motion: reduce){.progress .seg.active::after{animation:none;opacity:0.7;}}

  .topbar-actions{display:flex;gap:16px;align-items:center;justify-content:flex-end;margin-top:10px;}
  .topbar-actions button{background:none;border:none;padding:0;font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--text-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;}
  .topbar-actions button:hover{color:var(--text);}
  .topbar-actions .confirm-text{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--text-2);}
  .topbar-actions button.confirm-yes,.topbar-actions button.confirm-no{text-decoration:none;border:1px solid var(--border);border-radius:14px;padding:3px 11px;}
  .topbar-actions button.confirm-yes{color:var(--brick);border-color:var(--brick);}
  .topbar-actions button.confirm-no{color:var(--text-2);}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:0.74rem;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);display:flex;align-items:center;gap:6px;}
  .chip b{color:var(--text);font-weight:600;}
  .chip.warn{border-color:var(--amber);color:var(--amber);}
  .chip.danger{border-color:var(--brick);color:var(--brick);}

  .hero{text-align:center;padding:60px 10px 20px;}
  .hero h1{font-size:3.4rem;margin-bottom:18px;}
  .hero .lead{max-width:42ch;margin:0 auto 12px;color:var(--text);font-size:1.28rem;font-weight:600;line-height:1.4;}
  .hero .sub{max-width:44ch;margin:0 auto 28px;color:var(--text-2);font-size:0.98rem;}
  .cap-display{font-family:'IBM Plex Mono',monospace;font-size:1.1rem;color:var(--emerald);margin-bottom:32px;}

  .btn{display:inline-block;background:var(--text);color:var(--bg);border:none;border-radius:8px;padding:14px 28px;font-size:1rem;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;font-family:'IBM Plex Mono',monospace;}
  .btn:hover{opacity:0.88;}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border);text-transform:none;letter-spacing:0;font-family:'Plus Jakarta Sans',sans-serif;font-weight:500;padding:10px 18px;}

  h2.screen-title{font-size:1.7rem;margin-bottom:6px;}
  .screen-sub{color:var(--text-2);margin-bottom:24px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:560px){.grid2{grid-template-columns:1fr;}}

  .card-icon{display:inline-flex;width:26px;height:26px;color:var(--c,var(--text-2));margin-bottom:10px;}
  .card-icon svg{width:100%;height:100%;}

  .mood-badge{display:inline-flex;align-items:center;justify-content:center;color:var(--c,var(--emerald));transition:color .3s ease;}

  .screen-enter{animation:screenFade .3s ease;}
  @keyframes screenFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){.screen-enter{animation:none;}}

  .card{border:1px solid var(--border);border-radius:10px;background:var(--surface);box-shadow:var(--shadow);padding:20px;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;border-left:4px solid var(--c, var(--border));}
  .card:hover{transform:translateY(-2px);}
  .card h3{font-size:1.15rem;margin-bottom:6px;color:var(--text);}
  .card p{margin:0;color:var(--text-2);font-size:0.92rem;}
  .card .rate{font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:var(--c,var(--text-2));margin-top:8px;display:block;}
  .card.locked{cursor:not-allowed;opacity:0.5;background:var(--surface-2);}
  .card.locked:hover{transform:none;}
  .card.locked .lockmsg{font-family:'IBM Plex Mono',monospace;font-size:0.74rem;color:var(--text-2);margin-top:8px;}

  .opt-list{display:flex;flex-direction:column;gap:12px;}

  .consequence{border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);padding:28px;border-left:4px solid var(--c,var(--border));}
  .consequence .tag{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--c,var(--text-2));display:block;margin-bottom:10px;}
  .consequence h3{font-size:1.4rem;margin-bottom:12px;}
  .consequence p{margin-bottom:10px;}
  .delta{font-family:'IBM Plex Mono',monospace;font-size:1rem;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .calc-label{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;color:var(--text-2);opacity:0.7;margin-top:10px;}
  .calc-detail{font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:var(--text-2);margin-top:2px;}
  .delta .up{color:var(--emerald);}
  .delta .down{color:var(--brick);}

  .neon{
    background:radial-gradient(circle at 20% 0%, #3a1030 0%, #170a1c 55%, #0c0810 100%);
    border-color:#5b1f52; color:#f4e6ff;
  }
  .neon .tag{color:#ff6fd8;}
  .neon h3{color:#fff2fb;}
  .neon p{color:#dcc4e8;}

  .final-card{border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);padding:30px;border-left:5px solid var(--c,var(--emerald));}
  .final-card .arch{font-family:'Big Shoulders Display',sans-serif;font-size:2.1rem;text-transform:uppercase;color:var(--c,var(--text));margin-bottom:14px;}
  .final-card p{font-size:1.05rem;}

  .state-card{margin-top:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media (max-width:560px){.state-card{grid-template-columns:1fr 1fr;}}
  .meter{border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--surface-2);text-align:center;}
  .meter .lbl{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-2);margin-bottom:8px;}
  .meter .bars{display:flex;gap:3px;justify-content:center;}
  .meter .bar{width:14px;height:8px;border-radius:2px;background:var(--border);}
  .meter .bar.on{background:var(--c,var(--emerald));}

  .compare{margin-top:22px;border:1px solid var(--border);border-radius:10px;padding:18px 20px;background:var(--surface);}
  .compare .tag{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-2);display:block;margin-bottom:8px;}
  .compare.forecast{border-left:3px solid var(--c,var(--border));}
  .compare.forecast .tag{color:var(--c,var(--text-2));}
  .compare.altview{border-left:3px solid var(--indigo);}
  .compare.altview .tag{color:var(--indigo);}

  .actions{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;}

  .chip.up-changed{border-color:var(--emerald);background:var(--emerald-soft);color:var(--emerald);animation:pulse 1.6s ease-in-out 1;}
  .chip.down-changed{border-color:var(--brick);background:var(--brick-soft);color:var(--brick);animation:pulse 1.6s ease-in-out 1;}
  .chip.up-changed b,.chip.down-changed b{color:inherit;}
  .chip .delta-tag{font-weight:600;margin-left:2px;}
  @keyframes pulse{0%{transform:scale(1);}20%{transform:scale(1.08);}40%{transform:scale(1);}}
  @media (prefers-reduced-motion: reduce){.chip.up-changed,.chip.down-changed{animation:none;}}

  .cycle-banner{border:1px solid var(--border);border-left:3px solid var(--emerald);background:var(--surface);border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:0.9rem;color:var(--text-2);}
  .cycle-banner b{color:var(--text);}
  .cycle-banner .tag{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--emerald);display:block;margin-bottom:4px;}

  .reward{display:inline-block;margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:0.72rem;padding:3px 10px;border-radius:20px;}
  .reward.yes{background:var(--emerald-soft);color:var(--emerald);}
  .reward.no{background:var(--brick-soft);color:var(--brick);}

  .card.locked .lockmsg{display:block;}

  .history-wrap{margin-top:44px;border-top:1px solid var(--border);padding-top:18px;}
  .history-wrap summary{cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-2);padding:6px 0;}
  .history-wrap summary:hover{color:var(--text);}
  .hist-entry{border-left:3px solid var(--c,var(--border));background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin:10px 0 0;}
  .hist-entry .hcyc{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-2);}
  .hist-entry .htitle{font-weight:600;margin:2px 0 4px;}
  .hist-entry .htext{font-size:0.88rem;color:var(--text-2);}
  .hist-entry .hdelta{font-family:'IBM Plex Mono',monospace;font-size:0.82rem;margin-top:6px;}
</style>

<script>
(function(){
  try{
    var t = localStorage.getItem('fingramm_theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>

  };

  var TOTAL_CYCLES = 3;

  function freshState(){
    return {
      screen:'start', cycle:0, capital:START_CAPITAL,
      hasInvested:false, hasCourse:false, courseTrack:null, coursePaid:false,
      addiction:'none', debtType:'none', chasedLosses:false,
      justGambledLoss:false, hasPhone:false, phoneVia:null,
      pendingScenario:null, pendingResult:null,
      lastChangeSnap:null, history:[], comparison:null
    };
  }
  var state = load() || freshState();
  var showRestartConfirm = false;

  function save(){ try{ localStorage.setItem('fingramm_state', JSON.stringify(state)); }catch(e){} }
  function load(){
    try{
      var raw = localStorage.getItem('fingramm_state');
      if (!raw) return null;
      var saved = JSON.parse(raw);
      return Object.assign(freshState(), saved);
    }catch(e){ return null; }
  }
  function clamp0(n){ return Math.max(0, Math.round(n)); }
  function fmt(n){ return Math.round(n).toLocaleString('uk-UA') + ' ₴'; }
  function rand(min,max){ return min + Math.random()*(max-min); }
  function snapshotRelevant(s){
    return {capital:s.capital, hasCourse:s.hasCourse, courseTrack:s.courseTrack, coursePaid:s.coursePaid, addiction:s.addiction, debtType:s.debtType, hasPhone:s.hasPhone};
  }

  function bumpDebt(newType){
    if (SEVERITY.indexOf(newType) > SEVERITY.indexOf(state.debtType)) state.debtType = newType;
  }
  function bumpAddiction(){
    var i = ADDICTION_ORDER.indexOf(state.addiction);
    state.addiction = ADDICTION_ORDER[Math.min(i+1, ADDICTION_ORDER.length-1)];
  }

  function resolveInvestment(opt){
    var rate = opt.kind === 'fixed' ? opt.rate : rand(opt.min, opt.max);
    var before = state.capital;
    state.capital = clamp0(state.capital * (1+rate));
    state.hasInvested = true;
    state.justGambledLoss = false;
    var pct = (rate*100).toFixed(1).replace('.', ',');
    var sign = rate >= 0 ? '+' : '';
    var pctAbs = Math.abs(rate*100).toFixed(1).replace('.', ',');
    return {
      color: SCENARIOS.investment.color, title: opt.title,
      text: opt.desc + ' Цього року результат — ' + sign + pct + '%.',
      before: before, after: state.capital,
      calcLabel: 'капітал × (1 ' + (rate >= 0 ? '+' : '−') + ' ставка) = новий капітал',
      calc: fmt(before) + ' × (1 ' + (rate >= 0 ? '+' : '−') + ' ' + pctAbs + '%) = ' + fmt(state.capital)
    };
  }

  function resolvePotential(opt){
    var before = state.capital;
    if (opt.paid) state.capital = clamp0(state.capital - opt.cost);
    state.hasCourse = true;
    state.courseTrack = opt.track;
    state.coursePaid = opt.paid;
    state.justGambledLoss = false;
    var info = courseInfo[opt.track];
    var vacancy = opt.paid ? info.paidVacancy : info.freeVacancy;
    var salary = opt.paid ? info.paidSalary : info.freeSalary;
    var extra = vacancy
      ? ('Це наближає до вакансії «' + vacancy + '» ($' + salary + '/міс).')
      : 'Це відкриває доступ до міжнародного ринку вакансій незалежно від напряму.';
    return {
      color: SCENARIOS.potential.color, title: opt.title,
      text: opt.desc + ' ' + extra,
      before: before, after: state.capital
    };
  }

  function resolveQuick(opt){
    var before = state.capital;
    var chased = state.justGambledLoss && (opt.key === 'mfo' || opt.key === 'pyramid');
    if (chased) state.chasedLosses = true;
    state.capital = clamp0(state.capital + opt.capitalDelta);
    bumpDebt(opt.debtType);
    state.justGambledLoss = false;
    if (opt.reward && !state.hasPhone){ state.hasPhone = true; state.phoneVia = 'credit'; }
    var text = opt.desc;
    if (chased) text += ' Це рішення прийняте одразу після програшу в розвазі — спроба відігратися, і саме так починається боргова спіраль.';
    var calc = null, calcLabel = null;
    if (opt.capitalDelta !== 0){
      var amt = Math.abs(opt.capitalDelta);
      var pct = Math.round(amt / START_CAPITAL * 100);
      if (opt.key === 'pyramid'){
        calcLabel = 'вкладена сума × частка втрати = скільки згоріло';
        calc = fmt(START_CAPITAL) + ' × ' + pct + '% = ' + fmt(amt) + ' втрачено безповоротно';
      } else if (opt.key === 'mfo'){
        calcLabel = 'позика × (1 + денна ставка × дні) = сума до повернення';
        calc = fmt(START_CAPITAL) + ' × (1 + 1,5% × 30 днів) = ' + fmt(START_CAPITAL + amt) + ' до повернення → з капіталу списано переплату ' + fmt(amt);
      } else {
        calcLabel = 'позика × (1 + ставка) = сума до повернення';
        calc = fmt(START_CAPITAL) + ' × (1 + ' + pct + '%) = ' + fmt(START_CAPITAL + amt) + ' до повернення → з капіталу списано переплату ' + fmt(amt);
      }
    }
    return {
      color: SCENARIOS.quick.color, title: opt.title,
      text: text, before: before, after: state.capital, calc: calc, calcLabel: calcLabel
    };
  }

  function resolveEntertainment(opt){
    var before = state.capital;
    var lossFraction = rand(0.4, 0.8);
    state.capital = clamp0(state.capital * (1-lossFraction));
    bumpAddiction();
    state.justGambledLoss = true;
    var pct = Math.round(lossFraction*100);
    var pctPrecise = (lossFraction*100).toFixed(1).replace('.', ',');
    return {
      color: SCENARIOS.entertainment.color, title: opt.title, neon:true,
      text: opt.desc + ' Цього разу програно ' + pct + '% ставки.',
      before: before, after: state.capital,
      calcLabel: 'ставка × частка програшу = скільки втрачено',
      calc: fmt(before) + ' × ' + pctPrecise + '% = ' + fmt(before - state.capital) + ' втрачено цього разу'
    };
  }

  var RESOLVERS = { investment: resolveInvestment, potential: resolvePotential, quick: resolveQuick, entertainment: resolveEntertainment };

  // ---- ending template engine ----
  function debtTraps(d){ return d === 'mfo' || d === 'pyramid'; }
  function pickArchetype(s){
    if (debtTraps(s.debtType)) return 'pit';
    if (s.addiction === 'severe') return 'broken';
    if (s.hasInvested && s.hasCourse) return 'balanced';
    if (s.hasCourse) return 'learner';
    if (s.hasInvested) return 'investor';
    return 'observer';
  }
  var titles = {pit:'У борговій ямі', broken:'Зламаний грою', balanced:'Фінансово свідомий', learner:'Той, хто вчиться', investor:'Інвестор-початківець', observer:'Спостерігач'};
  var titleColors = {pit:'var(--brick)', broken:'var(--brick)', balanced:'var(--emerald)', learner:'var(--indigo)', investor:'var(--emerald)', observer:'var(--amber)'};
  var closings = {
    pit:'Технічно вибратись можна — але це вимагає років, а не циклів, що лишились у грі.',
    broken:'Гроші повертаються швидше, ніж час і довіра людей навколо.',
    balanced:'Гроші й навички почали працювати одне на одного — це і є мета гри.',
    learner:'Навички лишаються з тобою навіть тоді, коли гроші витрачені — найнадійніший актив із усіх.',
    investor:'Ти зрозумів головне: гроші можуть працювати самі — тепер справа за звичкою.',
    observer:'Обережно, без ризику й без росту — теж вибір, і гра лишає це без засудження.'
  };
  function moneyLine(s, arch, capFmt){
    if (arch === 'pit'){
      var lender = s.debtType === 'mfo' ? 'МФО' : 'фінансовою пірамідою';
      return 'Скільки б не назбирав за три роки — ' + capFmt + ' — усе перекриває борг перед ' + lender + ': рахунок насправді в мінусі.';
    }
    if (s.capital >= START_CAPITAL * 1.3) return 'Капітал виріс із 20 000 до ' + capFmt + ' ₴ — гроші справді працювали на тебе.';
    if (s.capital >= START_CAPITAL * 0.9) return 'Капітал лишився приблизно на тому ж рівні, ' + capFmt + ' ₴: ні прориву, ні падіння.';
    return 'Капітал просів до ' + capFmt + ' ₴ — менше, ніж було на старті.';
  }
  function skillLine(s, arch){
    if (!s.hasCourse) return 'Жодного курсу за три роки — потенціал так і лишився нерозкритим.';
    var info = courseInfo[s.courseTrack];
    var vacancy = s.coursePaid ? info.paidVacancy : info.freeVacancy;
    var salary = s.coursePaid ? info.paidSalary : info.freeSalary;
    var vac = vacancy ? ('відкриває вакансію ' + vacancy + ' за $' + salary + '/міс') : 'знімає мовний бар’єр і відкриває міжнародний ринок вакансій';
    if (arch === 'pit') return 'Курс ' + info.label + ' ' + vac + ' — але зараз ці навички не рятують від боргу.';
    var lead = s.coursePaid
      ? ('Платний курс ' + info.label + ' дав перевагу над іншими кандидатами: він ')
      : ('Безкоштовний курс ' + info.label + ' був планом Б, коли на платний не вистачило грошей, і все одно ');
    return lead + vac + '.';
  }
  function phoneLine(s, arch){
    if (!s.hasPhone) return 'iPhone так і лишився мрією — ні готівки, ні рішучості взяти в борг на нього не знайшлось.';
    if (s.phoneVia === 'saved') return 'iPhone у тебе в руках — і куплений за власні зароблені гроші, без жодної копійки боргу.';
    if (arch === 'pit') return 'iPhone у тебе в руках — але саме той кредит, яким ти його оплатив, і привів до боргової ями.';
    return 'iPhone у тебе в руках — узятий у борг ще на одному з перших кроків.';
  }
  function riskLine(s){
    if (s.chasedLosses) return 'Найгірше — кредит узятий одразу після програшу, у спробі відігратися. Це найшвидший шлях у боргову спіраль.';
    if (debtTraps(s.debtType)) return 'Ефективна ставка цього боргу — сотні відсотків річних: наздогнати її за час, що лишився, математично неможливо.';
    if (s.addiction === 'severe') return 'Розваги забрали не лише гроші, а й час і, ймовірно, стосунки — цю частину втрати капітал не показує.';
    if (s.addiction === 'mild') return 'Одна-дві спроби розваги ще не залежність, але звичка часто починається саме так.';
    return null;
  }
  function buildEnding(s){
    var arch = pickArchetype(s);
    var capFmt = Math.round(s.capital).toLocaleString('uk-UA');
    var lines = [moneyLine(s, arch, capFmt), phoneLine(s, arch), skillLine(s, arch), riskLine(s), closings[arch]].filter(Boolean);
    return { arch:arch, title:titles[arch], color:titleColors[arch], text: lines.join(' ') };
  }

  function forecastLine(s, arch){
    if (arch === 'pit') return 'За 10 років такий борг не зникає сам — щороку він лише обростає новими відсотками, якщо не взятися за виплату впритул зараз.';
    if (arch === 'broken') return 'За 10 років звичка встигає забрати значно більше, ніж будь-яка окрема сума — час і стосунки назад не купиш.';
    if (arch === 'observer') return 'Без ризику й без росту за 10 років лишається та сама сума, хіба зменшена інфляцією — це можна змінити одним рішучим вибором уже наступного разу.';
    var proj = Math.round(s.capital * Math.pow(1.10, 7)).toLocaleString('uk-UA');
    return 'Якщо капітал і далі працюватиме в такому ж темпі (умовно +10%/рік), до 10-річної позначки з моменту старту гри він міг би сягнути орієнтовно ' + proj + ' ₴.';
  }

  // ---- render ----
  var app = document.getElementById('app');

  function chipsRow(showDiff){
    var addLabel = {none:'немає', mild:'легка', severe:'важка'}[state.addiction];
    var debtLabel = {none:'немає', bank:'банк', mfo:'МФО', friend:'друзі', pyramid:'піраміда', pawnshop:'ломбард'}[state.debtType];
    var courseLabel = state.hasCourse ? (courseInfo[state.courseTrack].label + (state.coursePaid ? ' (платно)' : ' (безкоштовно)')) : 'немає';
    var addClass = state.addiction === 'severe' ? 'danger' : (state.addiction === 'mild' ? 'warn' : '');
    var debtClass = debtTraps(state.debtType) ? 'danger' : (state.debtType !== 'none' ? 'warn' : '');

    var capExtra = '', courseExtra = '', addExtra = '', debtExtra = '', phoneExtra = '';
    if (showDiff && state.lastChangeSnap){
      var b = state.lastChangeSnap.before, a = state.lastChangeSnap.after;
      if (a.capital !== b.capital){
        var d = a.capital - b.capital;
        capExtra = ' ' + (d >= 0 ? 'up-changed' : 'down-changed');
      }
      if (a.hasCourse && !b.hasCourse) courseExtra = ' up-changed';
      if (a.addiction !== b.addiction) addExtra = ' down-changed';
      if (a.debtType !== b.debtType) debtExtra = ' down-changed';
      if (a.hasPhone && !b.hasPhone) phoneExtra = ' up-changed';
    }

    return '<div class="chips">' +
      '<div class="chip' + capExtra + '">Капітал <b>' + fmt(state.capital) + '</b></div>' +
      '<div class="chip' + phoneExtra + '">📱 iPhone <b>' + (state.hasPhone ? (state.phoneVia === 'saved' ? 'куплений' : 'у борг') : 'ще ні') + '</b></div>' +
      '<div class="chip' + courseExtra + '">Курс <b>' + courseLabel + '</b></div>' +
      '<div class="chip ' + addClass + addExtra + '">Залежність <b>' + addLabel + '</b></div>' +
      '<div class="chip ' + debtClass + debtExtra + '">Борг <b>' + debtLabel + '</b></div>' +
      '</div>';
  }

  function topbar(){
    if (state.screen === 'start') return '';
    var isFinal = state.screen === 'final';
    var label = isFinal ? 'Фінал' : ('Рік ' + (state.cycle+1) + ' із ' + TOTAL_CYCLES);
    var segs = '';
    for (var i = 0; i < TOTAL_CYCLES; i++){
      var cls = 'seg';
      if (i < state.cycle) cls += ' done';
      else if (i === state.cycle && !isFinal) cls += ' active';
      segs += '<div class="' + cls + '"></div>';
    }
    var actions = isFinal ? '' : (
      showRestartConfirm ?
        '<div class="topbar-actions">' +
          '<span class="confirm-text">Точно спочатку?</span>' +
          '<button class="confirm-yes" onclick="Fingramm.confirmRestart(true)">Так</button>' +
          '<button class="confirm-no" onclick="Fingramm.confirmRestart(false)">Ні</button>' +
        '</div>' :
        '<div class="topbar-actions">' +
          '<button onclick="Fingramm.confirmRestart()">Почати спочатку</button>' +
        '</div>'
    );
    return '<div class="topbar">' +
      '<div class="topbar-row"><div class="logo">Fingramm</div>' +
        '<div style="display:flex;align-items:center;gap:10px;">' + themeToggleHtml() + moodBadge() + '<div class="cyc-badge mono">' + label + '</div></div>' +
      '</div>' +
      '<div class="progress">' + segs + '</div>' +
      actions +
      '</div>';
  }

  function currentTheme(){
    var explicit = document.documentElement.getAttribute('data-theme');
    if (explicit === 'light' || explicit === 'dark') return explicit;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }

  function themeToggleHtml(){
    var icon = currentTheme() === 'dark' ? '☀️' : '🌙';
    return '<button class="theme-toggle" onclick="Fingramm.toggleTheme()" title="Перемкнути тему" aria-label="Перемкнути тему">' + icon + '</button>';
  }

  function moodLevel(s){
    if (debtTraps(s.debtType) || s.addiction === 'severe') return 'crisis';
    if (s.addiction === 'mild' || s.debtType !== 'none') return 'stressed';
    return 'calm';
  }

  function moodBadge(){

    var mouth = lvl === 'crisis' ? 'M9 16q3-3 6 0' : (lvl === 'stressed' ? 'M9 15h6' : 'M9 14q3 3 6 0');
    var titleTxt = lvl === 'crisis' ? 'криза' : (lvl === 'stressed' ? 'напруга' : 'спокій');

      '<svg viewBox="0 0 24 24" width="20" height="20">' +
        '<circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/>' +
        '<circle cx="9" cy="10" r="1.1" fill="currentColor"/><circle cx="15" cy="10" r="1.1" fill="currentColor"/>' +
        '<path d="' + mouth + '" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>' +
      '</svg></div>';
  }

  function scenarioIcon(key){
    var icons = {
      investment: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v5c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 11v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></svg>',

      quick: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>',
      entertainment: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.3" fill="currentColor" stroke="none"/></svg>'

  }

  function renderStart(){
    return '<div class="hero">' +
      themeToggleHtml() +
      '<h1>Fingramm</h1>' +
      '<p class="lead">Хочеш новий iPhone за ≈40 000 ₴. У тебе — рівно половина.</p>' +
      '<p class="sub">Три роки, чотири шляхи розпорядитись грошима: «Швидкі рішення» дають бажане вже сьогодні, решта — грають на перспективу.</p>' +
      '<div class="cap-display">Стартовий капітал: ' + fmt(START_CAPITAL) + '</div>' +
      '<button class="btn" onclick="Fingramm.start()">Почати гру</button>' +
      '</div>';
  }

  function changeSummary(){
    if (!state.lastChangeSnap) return '';
    var b = state.lastChangeSnap.before, a = state.lastChangeSnap.after;
    var bits = [];
    if (a.capital !== b.capital) bits.push('капітал ' + (a.capital > b.capital ? '+' : '') + fmt(a.capital - b.capital));
    if (a.hasPhone && !b.hasPhone) bits.push('📱 отримав iPhone' + (state.phoneVia === 'saved' ? ' (за готівку)' : ' (у борг)'));
    if (a.hasCourse && !b.hasCourse) bits.push('новий курс');
    if (a.addiction !== b.addiction) bits.push('залежність → ' + ({none:'немає',mild:'легка',severe:'важка'})[a.addiction]);
    if (a.debtType !== b.debtType) bits.push('новий борг: ' + ({none:'немає',bank:'банк',mfo:'МФО',friend:'друзі',pyramid:'піраміда',pawnshop:'ломбард'})[a.debtType]);
    if (!bits.length) return '';
    return '<div class="cycle-banner"><span class="tag">✓ Рік ' + state.cycle + ' завершено</span>Зміни: ' + bits.join(' · ') + '.</div>';
  }

  function renderMenu(){
    var html = '<h2 class="screen-title">Рік ' + (state.cycle+1) + ' — обери шлях</h2>' +
      '<p class="screen-sub">Капітал і попередні вибори визначають, що доступно зараз.</p>' +
      changeSummary() +
      chipsRow(true) + '<div class="grid2">';
    ['investment','potential','quick','entertainment'].forEach(function(key){
      var sc = SCENARIOS[key];
      var ok = sc.available(state);
      if (ok){
        html += '<div class="card" style="--c:' + sc.color + '" onclick="Fingramm.openScenario(\'' + key + '\')">' +
          '<span class="card-icon">' + scenarioIcon(key) + '</span>' +
          '<h3>' + sc.title + '</h3><p>' + scenarioBlurb(key) + '</p></div>';
      } else {
        var reason = typeof sc.lockedReason === 'function' ? sc.lockedReason(state) : sc.lockedReason;
        html += '<div class="card locked">' +
          '<span class="card-icon">' + scenarioIcon(key) + '</span>' +
          '<h3>' + sc.title + '</h3><p>' + scenarioBlurb(key) + '</p>' +
          '<div class="lockmsg">🔒 ' + reason + '</div></div>';
      }
    });
    html += '</div>';
    return html;
  }

  function scenarioBlurb(key){
    return {
      investment:'Примножити те, що є.',
      potential:'Вкластись у навички на майбутнє.',
      quick:'Отримати гроші зараз, заплатити пізніше.',
      entertainment:'Спробувати виграти більше, ризикуючи всім.'
    }[key];
  }

  function renderOptions(){
    var sc = SCENARIOS[state.pendingScenario];
    var html = '<h2 class="screen-title">' + sc.title + '</h2>' +
      chipsRow() + '<div class="opt-list">';
    sc.options.forEach(function(opt){
      var affordable = !opt.cost || opt.cost <= state.capital;
      if (affordable){
        var rewardBadge = '';
        if (state.pendingScenario === 'quick'){
          rewardBadge = opt.reward
            ? '<span class="reward yes">🎁 маєш бажане просто зараз</span>'
            : '<span class="reward no">🎲 без миттєвої вигоди</span>';
        }
        html += '<div class="card" style="--c:' + sc.color + '" onclick="Fingramm.choose(\'' + opt.key + '\')">' +
          '<h3>' + opt.title + '</h3><p>' + opt.desc + '</p>' +
          (opt.badge ? '<span class="rate">' + opt.badge + '</span>' : '') +
          rewardBadge +
          '</div>';
      } else {
        html += '<div class="card locked"><h3>' + opt.title + '</h3><p>' + opt.desc + '</p>' +
          '<div class="lockmsg">🔒 Потрібно ще ' + fmt(opt.cost - state.capital) + '</div></div>';
      }
    });
    html += '</div><div class="actions"><button class="btn ghost" onclick="Fingramm.backToMenu()">← Назад</button></div>';
    return html;
  }

  function renderConsequence(){
    var r = state.pendingResult;
    var delta = r.after - r.before;
    var isLast = state.cycle >= TOTAL_CYCLES - 1;
    var neonClass = r.neon ? ' neon' : '';
    var html = '<div class="consequence' + neonClass + '" style="--c:' + r.color + '">' +
      '<span class="tag">' + r.title + '</span>' +
      '<p>' + r.text + '</p>' +
      '<div class="delta">' + fmt(r.before) + ' → <span id="deltaAfterNum">' + fmt(r.before) + '</span>' +
      ' <span class="' + (delta >= 0 ? 'up' : 'down') + '">(' + (delta >= 0 ? '+' : '') + fmt(delta).replace(' ₴','') + ' ₴)</span></div>' +
      (r.calc ? ((r.calcLabel ? '<div class="calc-label">' + r.calcLabel + '</div>' : '') + '<div class="calc-detail">↳ ' + r.calc + '</div>') : '') +
      '</div>' +
      '<div class="actions"><button class="btn" onclick="Fingramm.nextCycle()">' + (isLast ? 'Побачити фінал' : 'Далі →') + '</button></div>';
    return html;
  }

  function renderFinal(){
    var e = buildEnding(state);
    var cmp = state.comparison || {title:'ОВДП', rate:0.16, approx:false};
    var alt = Math.round(START_CAPITAL * Math.pow(1 + cmp.rate, TOTAL_CYCLES));
    var diff = state.capital - alt;
    var addFill = {none:0, mild:2, severe:4}[state.addiction];
    var courseFill = state.hasCourse ? 4 : 0;
    var investFill = state.hasInvested ? 4 : 0;
    var debtFill = {none:0, friend:1, pawnshop:2, bank:2, mfo:4, pyramid:4}[state.debtType];

    function meter(label, fill, color){
      var bars = '';
      for (var i=0;i<4;i++) bars += '<span class="bar' + (i<fill?' on':'') + '" style="--c:' + color + '"></span>';
      return '<div class="meter"><div class="lbl">' + label + '</div><div class="bars">' + bars + '</div></div>';
    }

    return '<div class="final-card" style="--c:' + e.color + '">' +
      '<div class="arch" style="color:' + e.color + '">' + e.title + '</div>' +
      '<p>' + e.text + '</p>' +
      '</div>' +
      '<div class="state-card">' +
        meter('Навички', courseFill, 'var(--indigo)') +
        meter('Інвестиції', investFill, 'var(--emerald)') +
        meter('Залежність', addFill, 'var(--brick)') +
        meter('Борг', debtFill, 'var(--amber)') +
      '</div>' +
      '<div class="compare forecast" style="--c:' + e.color + '"><span class="tag">⏳ Через 10 років</span>' + forecastLine(state, e.arch) + '</div>' +
      '<div class="compare altview"><span class="tag">🔀 А що якби</span>Якби ці 20 000 ₴ усі три роки просто лежали в ' + cmp.title + (cmp.approx ? ' під орієнтовно ' : ' під ') + Math.round(cmp.rate*100) + '% — вийшло б ' + fmt(alt) + '. У тебе зараз ' + fmt(state.capital) +
        ' (' + (diff>=0?'+':'') + fmt(diff) + ' до цього орієнтира).</div>' +
      '<div class="actions"><button class="btn" onclick="Fingramm.restart()">Зіграти ще раз</button></div>';
  }

  function historyHtml(){
    if (!state.history.length) return '';
    var items = state.history.map(function(h){
      var delta = h.after - h.before;
      var deltaTxt = delta === 0 ? 'без змін капіталу' : ((delta>0?'+':'') + fmt(delta));
      return '<div class="hist-entry" style="--c:' + h.color + '">' +
        '<div class="hcyc">Рік ' + h.cycle + ' · ' + h.scenario + '</div>' +
        '<div class="htitle">' + h.option + '</div>' +
        '<div class="htext">' + h.text + '</div>' +
        '<div class="hdelta">' + fmt(h.before) + ' → ' + fmt(h.after) + ' (' + deltaTxt + ')</div>' +
        '</div>';
    }).join('');
    return '<details class="history-wrap"><summary>Історія вибору (' + state.history.length + ')</summary>' + items + '</details>';
  }

  function render(){
    var html = topbar();
    if (state.screen === 'start') html += renderStart();
    else if (state.screen === 'menu') html += renderMenu();
    else if (state.screen === 'options') html += renderOptions();
    else if (state.screen === 'consequence') html += renderConsequence();
    else if (state.screen === 'final') html += renderFinal();
    if (state.screen !== 'start') html += historyHtml();
    app.innerHTML = '<div class="screen-enter">' + html + '</div>';
    if (state.screen === 'consequence') animateDelta();
    save();
  }

  function animateDelta(){
    var el = document.getElementById('deltaAfterNum');
    if (!el || !state.pendingResult) return;
    var from = state.pendingResult.before, to = state.pendingResult.after;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || from === to){ el.textContent = fmt(to); return; }
    var start = null, dur = 700;
    function step(ts){
      if (!start) start = ts;
      var p = Math.min(1, (ts - start) / dur);
      el.textContent = fmt(from + (to - from) * p);
      if (p < 1) requestAnimationFrame(step);
      else el.textContent = fmt(to);
    }
    requestAnimationFrame(step);
  }

  function pickComparison(){
    var opt = SCENARIOS.investment.options[Math.floor(Math.random() * SCENARIOS.investment.options.length)];
    var rate = opt.kind === 'fixed' ? opt.rate : (opt.min + opt.max) / 2;
    return { title: opt.title, rate: rate, approx: opt.kind === 'random' };
  }

  window.Fingramm = {
    start: function(){ state.screen = 'menu'; render(); },
    openScenario: function(key){ state.pendingScenario = key; state.screen = 'options'; render(); },
    backToMenu: function(){ state.pendingScenario = null; state.screen = 'menu'; render(); },
    choose: function(optKey){
      var sc = SCENARIOS[state.pendingScenario];
      var opt = sc.options.filter(function(o){ return o.key === optKey; })[0];
      var before = snapshotRelevant(state);
      var result = RESOLVERS[state.pendingScenario](opt);
      if (!state.hasPhone && state.capital >= PHONE_PRICE){ state.hasPhone = true; state.phoneVia = 'saved'; }
      var after = snapshotRelevant(state);
      state.lastChangeSnap = { before: before, after: after };
      state.history.push({
        cycle: state.cycle + 1, scenario: sc.title, option: opt.title,
        text: result.text, before: result.before, after: result.after, color: result.color
      });
      state.pendingResult = result;
      state.screen = 'consequence';
      render();
    },
    nextCycle: function(){
      state.cycle += 1;
      state.pendingScenario = null; state.pendingResult = null;
      if (state.cycle >= TOTAL_CYCLES){
        state.comparison = pickComparison();
        state.screen = 'final';
      } else {
        state.screen = 'menu';
      }
      render();
    },
    restart: function(){ state = freshState(); render(); },
    confirmRestart: function(yes){
      if (yes === undefined){ showRestartConfirm = true; render(); return; }
      showRestartConfirm = false;
      if (yes) state = freshState();
      render();
    },
    toggleTheme: function(){
      var next = currentTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try{ localStorage.setItem('fingramm_theme', next); }catch(e){}
      render();
    }
  };

  render();
})();
</script>
